<header class="nav" [class.scrolled]="scrolled()" (mouseleave)="openIndex.set(null)">
  <div class="bar">
    <a routerLink="/" class="logo" (click)="close()">
      <svg width="40" height="46" viewBox="0 0 40 46" aria-hidden="true">
        <path d="M20 0C9 0 1 8 1 18c0 12 19 28 19 28s19-16 19-28C39 8 31 0 20 0z" fill="#f26a1b" />
        <path d="M29 11l-7 7-10-3-2 2 8 4-3 6-3 .5 1 2 4-1 4 1 .5-3 4-3 3 6 2-2-3-9 6-6c1-1 0-3-2-2z" fill="#fff" transform="translate(0 1) scale(.9)" />
      </svg>
      <span class="brand"><b>Guidini</b><small>Explore • Réservez • Vivez la Tunisie</small></span>
    </a>

    <nav class="links" [class.open]="menuOpen()">
      <a routerLink="/" class="home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="close()">Accueil</a>
      @for (item of items; track item.label; let i = $index) {
        <div class="item" (mouseenter)="openIndex.set(i)">
          <button type="button" (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i">
            {{ item.label }}
            <svg class="chev" [class.up]="openIndex() === i" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
          </button>
          @if (openIndex() === i) {
            <ul class="drop">
              @for (c of item.children; track c.label) {
                <li><a [routerLink]="c.link" [fragment]="c.fragment" (click)="close()">{{ c.label }}</a></li>
              }
            </ul>
          }
        </div>
      }
    </nav>

    <div class="actions">
      <a routerLink="/login" class="btn outline" (click)="close()">Se connecter</a>
      <a routerLink="/register" class="btn solid" (click)="close()">S’inscrire</a>
    </div>

    <button class="burger" type="button" aria-label="Menu" (click)="menuOpen.set(!menuOpen())">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
