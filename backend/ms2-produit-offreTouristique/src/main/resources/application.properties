spring.application.name=ms2-produit-offre-touristique
server.port=8082

# Local development: persistent database relative to the launch directory.
spring.datasource.url=jdbc:h2:file:./data/guidini-ms2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Preserve existing data between restarts; adapt tables as entities evolve.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console locale pour consulter les tables pendant le developpement.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
