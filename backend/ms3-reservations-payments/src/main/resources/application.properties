spring.application.name=ms3-reservations-payments
server.port=8083

# MySQL (Docker, port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/ms3_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ (Docker)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Désactivés pour l'instant : Config Server et Eureka ne sont pas encore prêts
spring.cloud.config.enabled=false
eureka.client.enabled=false
# Prix par place provisoire (sera remplace par l'appel a MS2)
ms3.prix-unitaire-defaut=50

ms3.expiration-minutes=15
