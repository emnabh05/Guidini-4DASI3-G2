services:
  ms3-db:
    image: mysql:8
    container_name: ms3-mysql
    environment:
      MYSQL_DATABASE: ms3_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ms3-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ms3-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  ms3-reservations-payments:
    build: .
    container_name: ms3-app
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ms3-db:3306/ms3_db
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      ms3-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  ms3-db-data: